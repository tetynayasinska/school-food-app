<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шкільне харчування</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #fafaf7 0%, #01d1b2 100%);
            min-height: 100vh;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        .main-container {
            max-width: 520px;
            margin: 0 auto;
            padding: 20px 15px 40px;
        }
        .card-custom {
            background-color: rgb(204, 246, 233);
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.06);
        }
        .menu-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 14px;
        }
        .btn-choice {
            border-radius: 16px;
            padding: 16px;
            font-size: 1.15rem;
            font-weight: 600;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .btn-choice:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
<div class="main-container">
    <!-- Шапка -->
    <div class="text-center mb-3">
        <h3 class="fw-bold text-dark mb-1">🍽️ Шкільна їдальня</h3>
        <h4 class="fw-bold text-dark mb-1">Ставищенський ліцей №2</h4>
        <span class="badge bg-primary-subtle text-primary fs-6 px-3 py-2 rounded-pill">
            {{ menu.day }} • {{ today }}
        </span>
    </div>

    <!-- Картка меню на сьогодні -->
    <div class="card card-custom mb-4">
        <div class="card-body p-4">
            <h6 class="text-uppercase text-muted fw-bold small mb-2">Орієнтовне меню на сьогодні</h6>
            <img src="{{ url_for('static', filename='img/' + menu.img) }}"
                 alt="Меню дня"
                 class="menu-img mb-3"
                 onerror="this.style.display='none'">
            <p class="fs-5 text-dark mb-0 fw-medium">{{ menu.text }}</p>
        </div>
    </div>

    <!-- Блок 1: Вибір класу та учня (показується, якщо браузер ще не запам'ятав учня) -->
    <div id="selectCard" class="card card-custom mb-3 d-none">
        <div class="card-body p-4">
            <h5 class="fw-bold mb-3">Хто ти? Обери себе зі списку</h5>
            <div class="mb-3">
                <label for="classSelect" class="form-label fw-semibold">1. Твій клас</label>
                <select id="classSelect" class="form-select form-select-lg rounded-3">
                    <option value="" selected disabled>-- Оберіть клас --</option>
                    {% for cls in classes %}
                        <option value="{{ cls }}">{{ cls }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label for="studentSelect" class="form-label fw-semibold">2. Твоє прізвище та ім'я</label>
                <select id="studentSelect" class="form-select form-select-lg rounded-3" disabled>
                    <option value="" selected disabled>-- Спочатку оберіть клас --</option>
                </select>
            </div>
            <button id="confirmUserBtn" class="btn btn-primary btn-lg w-100 rounded-3 mt-2" disabled>
                Продовжити
            </button>
        </div>
    </div>

    <!-- Блок 2: Екран відмітки для збереженого учня -->
    <div id="actionCard" class="card card-custom mb-3 d-none">
        <div class="card-body p-4 text-center">
            <span id="studentClassBadge" class="badge bg-secondary-subtle text-secondary mb-2 px-3 py-1 rounded-pill"></span>
            <h4 class="fw-bold mb-2">Привіт, <span id="studentNameTitle"></span>!</h4>
            
            <div class="p-3 rounded-4 bg-light mb-4">
                <div class="small text-muted mb-1">Твій поточний статус на сьогодні:</div>
                <div id="currentStatusBadge" class="fs-5 fw-bold text-secondary">Завантаження...</div>
            </div>

            <div class="d-grid gap-3 mb-3">
                <button onclick="submitStatus('Їсть')" class="btn btn-success btn-choice shadow-sm">
                    🥗 Буду харчуватись
                </button>
                <button onclick="submitStatus('Не їсть')" class="btn btn-outline-danger btn-choice">
                    ❌ Пропущу сьогодні
                </button>
            </div>

            <div id="feedbackAlert" class="alert d-none rounded-3 py-2 mb-3" role="alert"></div>

            <button onclick="resetUser()" class="btn btn-link btn-sm text-muted text-decoration-none">
                🔄 Це не я / Змінити користувача
            </button>
        </div>
    </div>

    <!-- Навігація для вчителів та адміністратора -->
    <div class="text-center mt-4">
        <a href="{{ url_for('teacher') }}" class="btn btn-sm btn-outline-secondary rounded-pill me-2 px-3">
            👩‍🏫 Для вчителів
        </a>
        <a href="{{ url_for('admin') }}" class="btn btn-sm btn-outline-secondary rounded-pill px-3">
            🔐 Адміністратор
        </a>
    </div>
</div>

<script>
    const selectCard = document.getElementById('selectCard');
    const actionCard = document.getElementById('actionCard');
    const classSelect = document.getElementById('classSelect');
    const studentSelect = document.getElementById('studentSelect');
    const confirmUserBtn = document.getElementById('confirmUserBtn');

    function initApp() {
        const savedId = localStorage.getItem('school_student_id');
        const savedName = localStorage.getItem('school_student_name');
        const savedClass = localStorage.getItem('school_student_class');

        if (savedId && savedName && savedClass) {
            showActionScreen(savedId, savedName, savedClass);
        } else {
            selectCard.classList.remove('d-none');
            actionCard.classList.add('d-none');
        }
    }

    classSelect.addEventListener('change', async function () {
        const selectedClass = this.value;
        studentSelect.innerHTML = '<option value="" selected disabled>Завантаження...</option>';
        studentSelect.disabled = true;
        confirmUserBtn.disabled = true;

        const res = await fetch('/get_students/' + encodeURIComponent(selectedClass));
        const students = await res.json();

        studentSelect.innerHTML = '<option value="" selected disabled>-- Оберіть себе зі списку --</option>';
        students.forEach(s => {
            const opt = document.createElement('option');
            opt.value = s.id;
            opt.textContent = s.name;
            studentSelect.appendChild(opt);
        });
        studentSelect.disabled = false;
    });

    studentSelect.addEventListener('change', function () {
        confirmUserBtn.disabled = !this.value;
    });

    confirmUserBtn.addEventListener('click', function () {
        const id = studentSelect.value;
        const name = studentSelect.options[studentSelect.selectedIndex].text;
        const cls = classSelect.value;

        localStorage.setItem('school_student_id', id);
        localStorage.setItem('school_student_name', name);
        localStorage.setItem('school_student_class', cls);

        showActionScreen(id, name, cls);
    });

    async function showActionScreen(id, name, cls) {
        selectCard.classList.add('d-none');
        actionCard.classList.remove('d-none');
        document.getElementById('studentNameTitle').textContent = name;
        document.getElementById('studentClassBadge').textContent = 'Клас ' + cls;
        document.getElementById('feedbackAlert').classList.add('d-none');

        const res = await fetch('/get_student_status/' + id);
        const data = await res.json();
        updateStatusUI(data.status, data.timestamp);
    }

    function updateStatusUI(status, timestamp) {
        const badge = document.getElementById('currentStatusBadge');
        if (status === 'Їсть') {
            badge.className = 'fs-5 fw-bold text-success';
            badge.textContent = '🥗 Буду харчуватись';
        } else if (status === 'Не їсть') {
            badge.className = 'fs-5 fw-bold text-danger';
            badge.textContent = '❌ Не буду харчуватись';
        } else {
            badge.className = 'fs-5 fw-bold text-secondary';
            badge.textContent = '⏳ Ще не відмітився';
        }
    }

    async function submitStatus(status) {
        const studentId = localStorage.getItem('school_student_id');
        const feedback = document.getElementById('feedbackAlert');

        const res = await fetch('/submit_attendance', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ student_id: studentId, status: status })
        });
        const data = await res.json();

        if (data.success) {
            updateStatusUI(data.status, data.timestamp);
            feedback.className = status === 'Їсть'
                ? 'alert alert-success rounded-3 py-2 mb-3'
                : 'alert alert-warning rounded-3 py-2 mb-3';
            feedback.textContent = `✅ Збережено: "${status}". Якщо помилилися — просто натисніть іншу кнопку.`;
            feedback.classList.remove('d-none');
        }
    }

    function resetUser() {
        localStorage.removeItem('school_student_id');
        localStorage.removeItem('school_student_name');
        localStorage.removeItem('school_student_class');
        classSelect.value = '';
        studentSelect.innerHTML = '<option value="" selected disabled>-- Спочатку оберіть клас --</option>';
        studentSelect.disabled = true;
        confirmUserBtn.disabled = true;
        initApp();
    }

    initApp();
</script>
</body>
</html>
